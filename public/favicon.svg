<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#721832" />
      <stop offset="100%" stop-color="#400A19" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5CE66" />
      <stop offset="50%" stop-color="#E5A823" />
      <stop offset="100%" stop-color="#B37E10" />
    </linearGradient>
  </defs>

  <!-- Background Shield Shape -->
  <path
    d="M50 4 C72 4 88 12 88 28 C88 64 50 94 50 94 C50 94 12 64 12 28 C12 12 28 4 50 4 Z"
    fill="url(#shieldGrad)"
    stroke="url(#goldGrad)"
    stroke-width="3"
  />

  <!-- Inner Golden Border -->
  <path
    d="M50 9 C68 9 82 16 82 30 C82 60 50 87 50 87 C50 87 18 60 18 30 C18 16 32 9 50 9 Z"
    fill="none"
    stroke="url(#goldGrad)"
    stroke-width="1.2"
    stroke-dasharray="2 2"
    opacity="0.8"
  />

  <!-- Top Crown / Academic Cap Silhouette -->
  <path
    d="M34 22 L50 15 L66 22 L50 28 Z"
    fill="url(#goldGrad)"
  />
  <circle cx="50" cy="14" r="1.5" fill="#FFF" />

  <!-- Center "U" Monogram -->
  <text
    x="50"
    y="58"
    font-family="'Cinzel', 'Outfit', serif, sans-serif"
    font-size="34"
    font-weight="900"
    fill="url(#goldGrad)"
    text-anchor="middle"
    dominant-baseline="central"
    filter="drop-shadow(0 2px 4px rgba(0,0,0,0.4))"
  >U</text>

  <!-- Stars below U -->
  <g fill="url(#goldGrad)" transform="translate(0, 10)">
    <polygon points="50,60 51.5,64 55.5,64 52.5,66.5 53.5,70.5 50,68 46.5,70.5 47.5,66.5 44.5,64 48.5,64" />
    <polygon points="38,62 39,65 42,65 39.5,67 40.5,70 38,68 35.5,70 36.5,67 34,65 37,65" transform="scale(0.8) translate(10, 8)" />
    <polygon points="62,62 63,65 66,65 63.5,67 64.5,70 62,68 59.5,70 60.5,67 58,65 61,65" transform="scale(0.8) translate(16, 8)" />
  </g>
</svg>
